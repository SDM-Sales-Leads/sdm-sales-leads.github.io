<title>Lara · Elsewedy Industrial Development</title>

<style>
:root{--red:#B3263D;--deep:#7A1528;--ink:#2D2926;--gray:#767676;--bg:#F6F4F2;--card:#fff;--line:#E7E2DE;--in:#fff;--staff:#FFF6E5;--stage1:#2D2926;--stage2:#5a1420}
@media (prefers-color-scheme:dark){:root{--ink:#F2EFEC;--gray:#A8A29E;--bg:#161413;--card:#201D1B;--line:#34302D;--in:#2A2624;--staff:#3A3022}}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}
body{font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;background:var(--card);box-shadow:0 0 40px rgba(0,0,0,.06)}
.stage{position:relative;background:radial-gradient(120% 90% at 50% 0%,var(--stage2),var(--stage1) 70%);color:#fff;transition:height .35s ease;height:176px;flex:none;overflow:hidden}
.stage.call{height:min(52vh,380px)}.stage.min{height:58px}
.stage svg{position:absolute;left:50%;bottom:-6px;height:106%;transform:translateX(-50%);transition:height .35s,left .35s,transform .35s}
.stage.min svg{height:56px;left:34px;bottom:1px}
.top{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;gap:8px;padding:10px 12px;z-index:2}
.top b{font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.4)}.top small{display:block;font-size:11px;opacity:.85}
.top .sp{flex:1}.stage.min .top{padding-inline-start:66px}
.pill{border:0;color:#fff;background:rgba(255,255,255,.16);font:inherit;font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap;backdrop-filter:blur(6px)}
select.pill{appearance:none;padding-inline-end:10px}select.pill option{color:#000}
.cap{position:absolute;inset:auto 0 8px 0;text-align:center;font-size:12.5px;z-index:2;padding:0 12px;text-shadow:0 1px 6px rgba(0,0,0,.6);min-height:18px}
.stage.min .cap{display:none}
.callbar{position:absolute;inset:auto 0 30px 0;display:flex;justify-content:center;gap:10px;z-index:3}
.round{width:54px;height:54px;border-radius:50%;border:0;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.round.end{background:#D92D20}.round.mic{background:rgba(255,255,255,.2)}.round.mic.on{background:#12B76A;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,183,106,.6)}100%{box-shadow:0 0 0 16px rgba(18,183,106,0)}}
main{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:84%;padding:9px 12px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-line;word-wrap:break-word}
.m small{display:block;font-size:10.5px;opacity:.7;margin-bottom:2px}
.in{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:4px}
.out{align-self:flex-start;background:var(--in);border:1px solid var(--line);border-bottom-left-radius:4px}
.staff{background:var(--staff)}
.note{align-self:center;font-size:12px;color:var(--gray);text-align:center;padding:4px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.chips button{border:1px solid var(--red);color:var(--red);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
form.send{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
textarea,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea{resize:none;height:44px;max-height:120px}
button.go{background:var(--red);color:#fff;border:0;border-radius:14px;padding:0 16px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
button.go:disabled{opacity:.5}button.talk{background:var(--ink);color:var(--card)}
.start{padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.start h2{margin:0;font-size:18px}.start p{margin:0;color:var(--gray);font-size:13px}
.err{color:#B42318;font-size:13px}.foot{font-size:10.5px;color:var(--gray);text-align:center;padding:0 12px 8px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px}
.stars{display:flex;justify-content:center;gap:6px;direction:ltr}.stars button{font-size:34px;background:none;border:0;cursor:pointer;color:#D0CBC6}.stars button.on{color:#F5A524}
label.ck{display:flex;gap:8px;font-size:13px;align-items:flex-start}label.ck input{width:auto;margin-top:3px}
#head{transform-origin:100px 150px;animation:sway 7s ease-in-out infinite}
#body{animation:breathe 4.5s ease-in-out infinite;transform-origin:100px 230px}
@keyframes sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.3deg) translateY(-.6px)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@media (prefers-reduced-motion:reduce){#head,#body{animation:none}}
</style>
</head>

    req("/chat/start", { name: $("sn").value, phone: $("sp").value, email: $("se").value, text: $("sq").value.trim(), page: document.referrer ? "website" : "" }).then(function (r) {
      key = r.key; LS.set("lara_chat_key", key); $("start").hidden = true; openChat();
    }).catch(function (e) { $("se2").textContent = /not open/i.test(e.message) ? S.notopen : e.message; }).then(function () { $("sb").disabled = false; });
  };
})();
</script>
</body>
</html>
